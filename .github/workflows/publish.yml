name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Verify tag matches pyproject.toml version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          expected="${tag#v}"
          actual="$(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          if [ "$expected" != "$actual" ]; then
            echo "Tag $tag implies version $expected, but pyproject.toml has $actual"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Upload distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            body_file="$(mktemp)"
            gh release view "$tag" --json body --jq .body > "$body_file"
            if ! grep -q '^## Install$' "$body_file"; then
              {
                cat "$body_file"
                echo ""
                echo "## Install"
                echo ""
                echo '```bash'
                echo "pip install emap2lig==${version}"
                echo "pip install 'emap2lig[web]==${version}'  # Web GUI (emap2lig-gui)"
                echo '```'
                echo ""
                echo "PyPI: https://pypi.org/project/emap2lig/${version}/"
              } > "${body_file}.updated"
              gh release edit "$tag" --notes-file "${body_file}.updated"
            fi
          else
            notes_file="$(mktemp)"
            {
              gh api \
                --method POST \
                "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="$tag" \
                -f target_commitish="$GITHUB_SHA" \
                --jq .body
              echo ""
              echo "## Install"
              echo ""
              echo '```bash'
              echo "pip install emap2lig==${version}"
              echo "pip install 'emap2lig[web]==${version}'  # Web GUI (emap2lig-gui)"
              echo '```'
              echo ""
              echo "PyPI: https://pypi.org/project/emap2lig/${version}/"
            } > "$notes_file"
            gh release create "$tag" dist/* \
              --title "$tag" \
              --notes-file "$notes_file"
          fi

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          set +e
          output="$(uv publish 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE 'already exists|file already exists'; then
            echo "Version already on PyPI; skipping upload."
            exit 0
          fi
          exit "$status"
