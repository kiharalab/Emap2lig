name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Verify tag matches pyproject.toml version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          expected="${tag#v}"
          actual="$(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          if [ "$expected" != "$actual" ]; then
            echo "Tag $tag implies version $expected, but pyproject.toml has $actual"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          notes_append="$(cat <<EOF

## Install

\`\`\`bash
pip install emap2lig==${version}
pip install 'emap2lig[web]==${version}'  # Web GUI (emap2lig-gui)
\`\`\`

PyPI: https://pypi.org/project/emap2lig/${version}/
EOF
)"
          gh release create "$tag" dist/* \
            --title "$tag" \
            --generate-notes \
            --notes-append "$notes_append"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish
