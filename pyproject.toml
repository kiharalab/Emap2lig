[project]
name = "emap2lig"
version = "0.3.2"
description = "Official Emap2lig inference pipeline for finding ligand density blobs and building atomic ligand structures in cryo-EM maps."
readme = "README.md"
authors = [
    { name = "Shu Li", email = "li3916@purdue.edu" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "cuequivariance-ops-torch-cu12>=0.5.2 ; sys_platform == 'linux'",
    "cuequivariance-torch>=0.5.2 ; sys_platform == 'linux'",
    "einops>=0.8.1",
    "fairscale>=0.4.13",
    "gemmi>=0.7.1",
    "huggingface-hub>=0.31.1",
    "hydra-core>=1.3.2",
    "jaxtyping>=0.3.2",
    "lightning>=2.5.1.post0",
    "loguru>=0.7.3",
    "modelcif>=1.3",
    "mrcfile>=1.5.4",
    "numba>=0.61.2",
    "pdbeccdutils>=0.8.5",
    "pytest>=9.0.2",
    "pyyaml>=6.0.2",
    "rdkit>=2025.3.2",
    "requests>=2.32.3",
    "safetensors>=0.5.3",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "torch>=2.7.0",
    "tqdm>=4.67.1",
    "typer>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/kiharalab/Emap2lig"
Repository = "https://github.com/kiharalab/Emap2lig"
Issues = "https://github.com/kiharalab/Emap2lig/issues"

[project.scripts]
emap2lig = "emap2lig.main:app"
fragment-detect = "emap2lig.frag:app"

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "prek>=0.4.3",
    "types-tqdm>=4.67.0.20250417",
    "pandas>=2.3.0",
]
web = [
    "fastapi[standard]>=0.128.6",
]
