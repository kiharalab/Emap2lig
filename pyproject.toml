[project]
name = "emap2lig"
version = "0.4.4"
description = "Official Emap2lig inference pipeline for finding ligand density blobs and building atomic ligand structures in cryo-EM maps."
readme = "README.md"
authors = [
    { name = "Shu Li", email = "li3916@purdue.edu" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "cuequivariance-ops-torch-cu12>=0.5.2 ; sys_platform == 'linux'",
    "cuequivariance-torch>=0.5.2 ; sys_platform == 'linux'",
    "einops>=0.8.1",
    "gemmi>=0.7.1",
    "huggingface-hub>=0.31.1",
    "hydra-core>=1.3.2",
    "jaxtyping>=0.3.2",
    "lightning>=2.5.1.post0",
    "loguru>=0.7.3",
    "modelcif>=1.3",
    "mrcfile>=1.5.4",
    "pdbeccdutils>=0.8.5",
    "pyyaml>=6.0.2",
    "rdkit>=2025.3.2",
    "requests>=2.32.3",
    "safetensors>=0.5.3",
    "scipy>=1.15",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "typer>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/kiharalab/Emap2lig"
Repository = "https://github.com/kiharalab/Emap2lig"
Issues = "https://github.com/kiharalab/Emap2lig/issues"

[project.optional-dependencies]
web = [
    "fastapi[standard]>=0.128.6",
]

[project.scripts]
emap2lig = "emap2lig.main:app"
fragment-detect = "emap2lig.frag:app"
emap2lig-gui = "emap2lig.web.cli:cli"

[tool.uv.build-backend]
# Ship only pre-built frontend/dist/ in distributions — not React source or tooling.
source-exclude = [
    "**/AGENTS.md",
    "**/node_modules/**",
    "**/frontend/src/**",
    "**/frontend/vite/**",
    "**/frontend/public/**",
    "**/frontend/package.json",
    "**/frontend/package-lock.json",
    "**/frontend/vite.config.ts",
    "**/frontend/tsconfig*.json",
    "**/frontend/eslint.config.js",
    "**/frontend/index.html",
]
wheel-exclude = [
    "**/AGENTS.md",
    "**/node_modules/**",
    "**/frontend/src/**",
    "**/frontend/vite/**",
    "**/frontend/public/**",
    "**/frontend/package.json",
    "**/frontend/package-lock.json",
    "**/frontend/vite.config.ts",
    "**/frontend/tsconfig*.json",
    "**/frontend/eslint.config.js",
    "**/frontend/index.html",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "prek>=0.5.7",
    "types-tqdm>=4.70.0.20260906",
    "pytest>=9.2.0",
]
web = [
    "fastapi[standard]>=0.128.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
