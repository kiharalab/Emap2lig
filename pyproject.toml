[project]
name = "emap2lig"
version = "0.5.0"
description = "Official Emap2lig inference pipeline for finding ligand density blobs and building atomic ligand structures in cryo-EM maps."
readme = "README.md"
authors = [
    { name = "Shu Li", email = "li3916@purdue.edu" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "einops>=0.8.1",
    "gemmi>=0.7.1",
    "huggingface-hub>=0.31.1",
    "lightning>=2.5.1.post0",
    "modelcif>=1.3",
    "mrcfile>=1.5.4",
    "pdbeccdutils>=0.8.5",
    "pyyaml>=6.0.2",
    "rdkit>=2025.3.2",
    "requests>=2.32.3",
    "rich>=13.0",
    "safetensors>=0.5.3",
    "scipy>=1.15",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "typer>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/kiharalab/Emap2lig"
Repository = "https://github.com/kiharalab/Emap2lig"
Issues = "https://github.com/kiharalab/Emap2lig/issues"

[project.optional-dependencies]
web = [
    "fastapi[standard]>=0.128.6",
]

[project.scripts]
emap2lig = "emap2lig.cli.main:app"
fragment-detect = "emap2lig.cli.frag:app"
emap2lig-gui = "emap2lig.cli.gui:cli"

[tool.uv.build-backend]
# Frontend source lives in shuuul/Emap2lig-web; only frontend/dist/ is in this repo.
source-exclude = ["**/AGENTS.md", "**/frontend/.gitignore"]
wheel-exclude = ["**/AGENTS.md", "**/frontend/.gitignore"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "prek>=0.5.7",
    "types-tqdm>=4.70.0.20260906",
    "pytest>=9.2.0",
]
# Same packages as the `web` extra, so `uv sync --group web` keeps working.
web = [
    "emap2lig[web]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
